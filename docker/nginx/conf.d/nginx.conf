server {
    listen 80;
    server_name localhost;
    root /var/www/handyman/public;
    index index.php index.html;

    charset utf-8;

    # Адреса через переменные: иначе nginx резолвит app/reverb один раз при старте
    # и после пересоздания контейнера (новый IP) отдаёт 502 до рестарта nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream    app:9000;
    set $reverb_upstream reverb:8080;
    set $sms_upstream    sms-gateway:3000;
    client_max_body_size 150M;      # иначе 413 ещё до PHP
    fastcgi_read_timeout 120s;      # дефолт 60 — оборвёт на середине

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/(app|apps)/ {
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # OTP gateway socket for the SMS phone. Only the Socket.IO path is public —
    # /emit-otp and /health stay reachable from the app container alone.
    location /socket.io/ {
        proxy_pass http://$sms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
