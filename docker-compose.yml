x-php-build: &php-build
  build:
    context: .
    dockerfile: ./docker/php/Dockerfile
  volumes:
    - app_code:/var/www/laravel 
  env_file:
    - .env

services:
  php:
    <<: *php-build
    container_name: handyman_php  
    user: www-data   
    restart: unless-stopped
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.30-alpine
    container_name: handyman_nginx 
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./docker/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf:ro  
      - app_code:/var/www/laravel:ro
    depends_on:
      - php  
      
  queue:
    <<: *php-build
    container_name: handyman_queue
    user: www-data
    command: php artisan queue:work --tries=3 --backoff=5 --max-time=3600
    restart: unless-stopped
    depends_on:
      - db
      - redis

  reverb:
    <<: *php-build
    container_name: handyman_reverb
    user: www-data
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped  
    expose:
      - 8080
    depends_on:
      - db
      - redis

  scheduler:
    <<: *php-build
    container_name: handyman_scheduler
    user: www-data
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      - db
      - redis    

  artisan:
    <<: *php-build
    entrypoint: ["php", "/var/www/laravel/artisan"]
    user: www-data
    profiles: ["tools"]
    depends_on:
      - db

  db:
    image: mysql:8.0 
    container_name: handyman_db 
    restart: unless-stopped
    env_file:
      - docker/db.env  
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: handyman_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data  

volumes:
  db_data:  
  redis_data:
  app_code: