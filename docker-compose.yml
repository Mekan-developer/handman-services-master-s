x-php: &php
  image: handyman-php:local
  env_file: [.env]
  user: "${UID:-1000}:${GID:-1000}"
  restart: unless-stopped
  depends_on:
    db:    { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  app:
    <<: *php
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org/debian}
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-HANDYMAN}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    container_name: handyman_app

  nginx:
    image: nginx:1.27-alpine
    container_name: handyman_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on: [app]

  queue:
    <<: *php
    container_name: handyman_queue
    # laravel/horizon не установлен — обычный worker.
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    stop_grace_period: 60s

  reverb:
    <<: *php
    container_name: handyman_reverb
    user: www-data
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    expose: ["8080"]

  scheduler:
    <<: *php
    container_name: handyman_scheduler
    command: php artisan schedule:work

  artisan:
    <<: *php
    entrypoint: ["php", "/var/www/handyman/artisan"]
    profiles: ["tools"]
    restart: "no"

  sms-gateway:
    build:
      context: ./socket-server
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: handyman-sms:local
    container_name: handyman_sms
    restart: unless-stopped
    env_file: [./socket-server/.env]
    environment:
      OTP_SECRET: ${OTP_SECRET:-dev-otp-secret}
      ENABLE_TEST_PAGE: ${SMS_GATEWAY_TEST_PAGE:-true}

  db:
    image: mysql:8.0
    container_name: handyman_mysql
    restart: unless-stopped
    env_file: [docker/db.env]
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: handyman_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
