x-php-build: &php-dev
  build:
    context: .
    dockerfile: ./docker/php/Dockerfile
  volumes:
    - ./:/var/www/laravel 
  restart: "no"  

services:
  php:
    <<: *php-dev

  nginx:
    restart: "no"
    ports: !override
      - 8000:80
    volumes:
      - ./docker/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf:ro  
      - ./:/var/www/laravel
      
  queue:
    <<: *php-dev
    command: php artisan queue:listen --tries=3 --backoff=5

  reverb:
    <<: *php-dev
    ports:
      - 8080:8080 

  artisan:
    <<: *php-dev

  db:
    restart: "no"
    ports:
      - 3316:3306

  redis:
    restart: "no"
    ports:
      - "6379:6379"