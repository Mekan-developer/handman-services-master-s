# Прод-оверрайд: .env монтируется файлом; storage — том (логи/кэш/uploads).
# user root — entrypoint делает chown и сбрасывает в www-data (см. entrypoint.prod.sh).
# env_file сброшен: иначе env-переменные контейнера перекрывают .env на диске,
# и правки .env не применяются после `restart` (только после пересоздания).
services:
  app:
    user: "0:0"
    env_file: !reset []
    volumes: !override
      - ./.env:/var/www/handyman/.env:ro
      - storage_data:/var/www/handyman/storage
  queue:
    user: "0:0"
    env_file: !reset []
    volumes: !override
      - ./.env:/var/www/handyman/.env:ro
      - storage_data:/var/www/handyman/storage
  reverb:
    user: "0:0"
    env_file: !reset []
    volumes: !override
      - ./.env:/var/www/handyman/.env:ro
      - storage_data:/var/www/handyman/storage
  scheduler:
    user: "0:0"
    env_file: !reset []
    volumes: !override
      - ./.env:/var/www/handyman/.env:ro
      - storage_data:/var/www/handyman/storage
  # Без entrypoint (нет chown/gosu) — запускаем сразу от www-data, иначе
  # `artisan migrate` создаст лог в storage от root и FPM не сможет в него писать.
  artisan:
    user: "${UID:-1000}:${GID:-1000}"
    env_file: !reset []
    volumes: !override
      - ./.env:/var/www/handyman/.env:ro
      - storage_data:/var/www/handyman/storage

  nginx:
    image: handyman-nginx:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx
      args:
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-HANDYMAN}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    volumes: !override
      - storage_data:/var/www/handyman/storage:ro

  sms-gateway:
    environment:
      ENABLE_TEST_PAGE: "false"

volumes:
  storage_data:
